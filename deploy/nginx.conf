server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /gemini-proxy to broker service
    # This route will be replaced with actual Cloud Run URL at deploy time
    location /gemini-proxy/ {
        # BROKER_URL will be injected via environment or replaced in deploy script
        proxy_pass ${BROKER_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Also proxy /image-proxy for Unsplash images
    location /image-proxy/ {
        proxy_pass https://images.unsplash.com/;
        proxy_http_version 1.1;
        proxy_set_header Host images.unsplash.com;
        proxy_ssl_server_name on;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
